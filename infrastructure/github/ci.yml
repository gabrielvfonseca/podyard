name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Install · Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      # Build-time env placeholders. Real values live in the Vercel
      # dashboard; these satisfy t3-oss validation during CI.
      SKIP_ENV_VALIDATION: "true"
      SENTRY_AUTH_TOKEN: ci-token
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/podyard
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: podyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Push Drizzle schema
        run: cd packages/database && bunx drizzle-kit push

      - name: Typecheck
        run: bunx turbo run typecheck

      - name: Lint (ultracite)
        run: bun run check

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            apps/app/.next
            apps/web/.next
            apps/api/.next
          if-no-files-found: ignore
          retention-days: 7
